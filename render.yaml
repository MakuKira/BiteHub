services:
  - type: web
    name: bitehub
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m py_compile server.py
    startCommand: python server.py --host 0.0.0.0 --port $PORT --behind-proxy
    envVars:
      - key: BITEHUB_REQUIRE_POSTGRES
        value: "true"
      - key: BITEHUB_DATABASE_URL
        sync: false
